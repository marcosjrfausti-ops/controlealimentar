<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fine Tuning - Tracker</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1c1c1e;
            --icon-bg: #2c2927;
            --text-main: #f5f5f5;
            --text-sec: #9e9e9e;
            --accent: #bb86fc;
            --carb-color: #a275ff;
            --fat-color: #ff5252;
            --prot-color: #ffca28;
            --border-color: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 600px;
            position: relative;
            background-color: var(--bg-color);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .screen {
            display: none;
            padding: 1.5rem;
            animation: fadeIn 0.3s ease;
            padding-bottom: 3rem;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* HOME SCREEN */
        #home-screen {
            height: 100vh;
            padding: 0;
        }
        
        #home-screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .home-title {
            position: absolute;
            top: 3rem;
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        .home-btn {
            background-color: var(--accent);
            color: #0d0d0d;
            border: none;
            padding: 1rem 4rem;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(187, 134, 252, 0.3);
        }

        .home-btn:hover {
            background-color: #a46cf5;
            transform: scale(1.05);
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 1rem;
        }

        .header h2 {
            font-size: 1.2rem;
            font-weight: 500;
            flex-grow: 1;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-sec);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
        }

        /* MEAL CARD */
        .meal-card {
            display: flex;
            align-items: center;
            padding: 1.2rem 0;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .meal-card:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .meal-icon {
            width: 50px;
            height: 50px;
            background-color: var(--icon-bg);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            margin-right: 1rem;
            flex-shrink: 0;
        }

        .meal-content {
            flex-grow: 1;
            padding-right: 1rem;
        }

        .meal-title {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 0.2rem;
        }

        .meal-desc {
            font-size: 0.75rem;
            color: var(--text-sec);
            margin-bottom: 0.4rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }

        .meal-kcal {
            font-size: 0.8rem;
            color: var(--text-sec);
            margin-bottom: 0.5rem;
        }

        .macros-bar {
            display: flex;
            height: 4px;
            border-radius: 2px;
            overflow: hidden;
            background-color: #333;
            margin-bottom: 0.3rem;
            width: 100%;
        }

        .macros-text {
            font-size: 0.65rem;
            color: var(--text-sec);
            display: flex;
            gap: 0.5rem;
        }

        .dot {
            display: flex;
            align-items: center;
        }

        .dot::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 4px;
        }
        .dot-carb::before { background-color: var(--carb-color); }
        .dot-fat::before { background-color: var(--fat-color); }
        .dot-prot::before { background-color: var(--prot-color); }

        .add-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.8rem;
            font-weight: 300;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-radius: 50%;
            transition: background-color 0.2s;
        }

        .add-btn:hover {
            background-color: var(--icon-bg);
        }

        /* DETAILS SCREEN */
        .macro-summary {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .macro-summary h3 {
            font-size: 2.5rem;
            font-weight: 300;
            text-align: center;
            margin-bottom: 1rem;
        }

        .macro-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            text-align: center;
        }
        
        .macro-grid-item p {
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .macro-grid-item span {
            font-size: 0.75rem;
            color: var(--text-sec);
        }

        .food-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background-color: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 0.8rem;
        }

        .food-name {
            font-weight: 500;
            font-size: 0.95rem;
        }
        
        .food-macros {
            font-size: 0.75rem;
            color: var(--text-sec);
            margin-top: 0.3rem;
        }

        /* FORM STYLES (NOVO CADASTRO) */
        .form-section {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .form-section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            color: var(--accent);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }
        
        .form-group {
            margin-bottom: 1.2rem;
        }
        
        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-sec);
            margin-bottom: 0.5rem;
        }
        
        .input-group {
            display: flex;
            gap: 0.5rem;
        }
        
        .input-control {
            flex-grow: 1;
            width: 100%;
            background-color: #2c2c2e;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .input-control:focus {
            border-color: var(--accent);
        }
        
        .fixed-unit {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--icon-bg);
            padding: 0 1rem;
            border-radius: 8px;
            color: var(--text-sec);
            font-size: 0.9rem;
            min-width: 60px;
        }
        
        .unit-select {
            background-color: #2c2c2e;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }
        
        .unit-select:focus {
            border-color: var(--accent);
        }

        .save-btn {
            width: 100%;
            padding: 1.2rem;
            background-color: var(--accent);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: background-color 0.2s;
        }

        .save-btn:hover {
            background-color: #a46cf5;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 600px;
            border-radius: 20px 20px 0 0;
            padding: 2rem 1.5rem;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-btn {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            background-color: var(--icon-bg);
            color: var(--text-main);
            transition: background-color 0.2s;
        }

        .modal-btn:hover {
            background-color: #3d3a38;
        }
        
        .modal-btn.primary {
            background-color: var(--accent);
            color: #000;
        }

        .modal-btn.primary:hover {
            background-color: #a46cf5;
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- TELA 0: INICIAL -->
        <div id="home-screen" class="screen active">
            <h1 class="home-title">Fine Tuning</h1>
            <button class="home-btn" onclick="startApp()">Dieta</button>
        </div>

        <!-- TELA 1: LISTA DE REFEIÇÕES -->
        <div id="dashboard-screen" class="screen">
            <div class="header">
                <button class="icon-btn" onclick="goHome()">&#10094;</button>
                <h2>Registrar refeição</h2>
                <button class="icon-btn">&#8942;</button>
            </div>
            <div id="meals-container">
                <!-- Renderizado via JS -->
            </div>
        </div>

        <!-- TELA 2: DETALHES DA REFEIÇÃO -->
        <div id="details-screen" class="screen">
            <div class="header">
                <button class="icon-btn" onclick="goBackToDashboard()">&#10094;</button>
                <h2 id="detail-title">Detalhes</h2>
            </div>
            
            <div class="macro-summary">
                <h3 id="detail-kcal">0 kcal</h3>
                <div class="macro-grid">
                    <div class="macro-grid-item">
                        <span style="color: var(--carb-color)">Carboidr</span>
                        <p id="detail-carb">0g</p>
                    </div>
                    <div class="macro-grid-item">
                        <span style="color: var(--fat-color)">Gord.</span>
                        <p id="detail-fat">0g</p>
                    </div>
                    <div class="macro-grid-item">
                        <span style="color: var(--prot-color)">Proteína</span>
                        <p id="detail-prot">0g</p>
                    </div>
                </div>
            </div>

            <h3 style="font-size: 1rem; margin-bottom: 1rem; font-weight: 500;">Alimentos Consumidos</h3>
            <div id="foods-container">
                <!-- Renderizado via JS -->
            </div>
        </div>

        <!-- TELA 3: CADASTRAR ALIMENTOS -->
        <div id="add-food-screen" class="screen">
            <div class="header">
                <button class="icon-btn" onclick="goBackFromAddFood()">&#10094;</button>
                <h2>Cadastrar Alimento</h2>
            </div>

            <form id="add-food-form">
                
                <!-- Informação Básica -->
                <div class="form-section">
                    <div class="form-section-title">📝 Informação Nutricional</div>
                    <div class="form-group">
                        <label>Nome</label>
                        <input type="text" id="food-name" class="input-control" placeholder="Ex: Arroz Branco" required>
                    </div>
                    <div class="form-group">
                        <label>Porção</label>
                        <div class="input-group">
                            <input type="text" id="food-portion" class="input-control decimal-input" placeholder="0,000" inputmode="decimal" required>
                            <select id="food-portion-unit" class="unit-select">
                                <option value="g">g</option>
                                <option value="un">un</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Valor energético</label>
                        <div class="input-group">
                            <input type="text" id="food-kcal" class="input-control decimal-input" placeholder="0,000" inputmode="decimal" required>
                            <div class="fixed-unit">kcal</div>
                        </div>
                    </div>
                </div>

                <!-- Macronutrientes -->
                <div class="form-section">
                    <div class="form-section-title">🍞 Macronutrientes</div>
                    <div class="form-group">
                        <label>Carboidratos totais</label>
                        <div class="input-group">
                            <input type="text" id="food-carb" class="input-control decimal-input" placeholder="0,000" inputmode="decimal">
                            <div class="fixed-unit">g</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Açúcares totais</label>
                        <div class="input-group">
                            <input type="text" id="food-sugar" class="input-control decimal-input" placeholder="0,000" inputmode="decimal">
                            <div class="fixed-unit">g</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Açúcares adicionados</label>
                        <div class="input-group">
                            <input type="text" id="food-added-sugar" class="input-control decimal-input" placeholder="0,000" inputmode="decimal">
                            <div class="fixed-unit">g</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Proteínas</label>
                        <div class="input-group">
                            <input type="text" id="food-prot" class="input-control decimal-input" placeholder="0,000" inputmode="decimal">
                            <div class="fixed-unit">g</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Gorduras totais</label>
                        <div class="input-group">
                            <input type="text" id="food-fat" class="input-control decimal-input" placeholder="0,000" inputmode="decimal">
                            <div class="fixed-unit">g</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Gorduras saturadas</label>
                        <div class="input-group">
                            <input type="text" id="food-sat-fat" class="input-control decimal-input" placeholder="0,000" inputmode="decimal">
                            <div class="fixed-unit">g</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Gorduras trans</label>
                        <div class="input-group">
                            <input type="text" id="food-trans-fat" class="input-control decimal-input" placeholder="0,000" inputmode="decimal">
                            <div class="fixed-unit">g</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Fibra alimentar</label>
                        <div class="input-group">
                            <input type="text" id="food-fiber" class="input-control decimal-input" placeholder="0,000" inputmode="decimal">
                            <div class="fixed-unit">g</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Sódio</label>
                        <div class="input-group">
                            <input type="text" id="food-sodium" class="input-control decimal-input" placeholder="0,000" inputmode="decimal">
                            <div class="fixed-unit">mg</div>
                        </div>
                    </div>
                </div>

                <!-- Vitaminas (Exemplo reduzido para o script, mas os IDs seguem o padrão) -->
                <div class="form-section">
                    <div class="form-section-title">💊 Micronutrientes (Vitaminas)</div>
                    
                    <div class="form-group">
                        <label>Vitamina A</label>
                        <div class="input-group">
                            <input type="text" id="food-vit-a" class="input-control decimal-input" placeholder="0,000" inputmode="decimal">
                            <select id="food-vit-a-unit" class="unit-select" onchange="toggleRef(this)">
                                <option value="mcg">mcg</option>
                                <option value="g">g</option>
                                <option value="%">%</option>
                            </select>
                        </div>
                        <div class="ref-group" style="display: none; margin-top: 0.5rem;">
                            <label style="font-size: 0.8rem;">Valor de Referência (%)</label>
                            <input type="text" id="food-vit-a-ref" class="input-control decimal-input" placeholder="0,000" inputmode="decimal">
                        </div>
                    </div>
                    <!-- (Pode replicar as demais vitaminas adicionando os respectivos IDs como id="food-vit-c", id="food-vit-c-unit", etc) -->
                </div>

                <button type="submit" class="save-btn">Salvar Alimento</button>
            </form>
        </div>
    </div>

    <!-- MODAL DE AÇÕES -->
    <div id="action-modal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="margin-bottom: 1.5rem; text-align: center; font-weight: 500;" id="modal-title">Opções</h3>
            <button class="modal-btn" onclick="handleEdit()">Editar alimentos</button>
            <button class="modal-btn primary" onclick="handleAdd()">Cadastrar novos alimentos</button>
        </div>
    </div>

    <!-- IMPORTANDO O SDK DO FIREBASE COMO MÓDULO VIA CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Configuração do Firebase do seu projeto 'CONTROLE-ALIMENTAR'
        const firebaseConfig = {
            apiKey: "AIzaSyBLTPfj097saA-VrtxqWCLWDdS5acjgbEs",
            authDomain: "os-coretiva-preventiva.firebaseapp.com",
            projectId: "os-coretiva-preventiva",
            storageBucket: "os-coretiva-preventiva.firebasestorage.app",
            messagingSenderId: "1074947472672",
            appId: "1:1074947472672:web:c797327b7c398fa94b2b45",
            measurementId: "G-H01XP1X013"
        };

        // Inicializa o Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- FUNÇÕES DE LÓGICA DO APP ---

        function formatNumberPTBR(num) {
            if (num === undefined || num === null || isNaN(num)) return "0";
            return new Intl.NumberFormat('pt-BR', {
                minimumFractionDigits: 0,
                maximumFractionDigits: 3 
            }).format(num);
        }

        // Converte string pt-BR para Float numérico que vai pro banco de dados
        function parseInputPTBR(str) {
            if (!str) return 0;
            const cleanStr = str.replace(/\./g, '').replace(',', '.');
            const val = parseFloat(cleanStr);
            return isNaN(val) ? 0 : val;
        }

        // Mock temporário para exibição das refeições
        const firestoreMock = {
            meals: [
                { id: "meal_1", title: "Café da manhã", icon: "🌅", foods: [ { name: "Ovo Mexido", amount: "100g", kcal: 398.5, carb: 4.2, fat: 70.4, prot: 26 } ] },
                { id: "meal_2", title: "Almoço", icon: "☀️", foods: [ { name: "Albumina (Naturovos)", amount: "2 scoops", kcal: 110, carb: 2.45, fat: 0.4, prot: 24.8 } ] },
                { id: "meal_3", title: "Jantar", icon: "🌙", foods: [ { name: "Arroz Premium", amount: "150g", kcal: 195, carb: 42, fat: 0, prot: 4 } ] },
                { id: "meal_4", title: "Lanches", icon: "🌤️", foods: [] }
            ]
        };

        // --- NAVEGAÇÃO (atreladas ao window pois estamos em um script type="module") ---
        window.startApp = () => {
            document.getElementById("home-screen").classList.remove("active");
            document.getElementById("dashboard-screen").classList.add("active");
        };

        window.goHome = () => {
            document.getElementById("dashboard-screen").classList.remove("active");
            document.getElementById("home-screen").classList.add("active");
        };

        window.goBackToDashboard = () => {
            document.getElementById("details-screen").classList.remove("active");
            document.getElementById("dashboard-screen").classList.add("active");
        };

        window.goBackFromAddFood = () => {
            document.getElementById("add-food-form").reset();
            document.querySelectorAll(".ref-group").forEach(el => el.style.display = "none");
            document.getElementById("add-food-screen").classList.remove("active");
            document.getElementById("dashboard-screen").classList.add("active");
        };

        window.toggleRef = (selectElement) => {
            const refGroup = selectElement.parentElement.nextElementSibling;
            if (selectElement.value === '%') {
                refGroup.style.display = 'block';
            } else {
                refGroup.style.display = 'none';
                refGroup.querySelector("input").value = ""; 
            }
        };

        // --- CÁLCULOS E RENDERIZAÇÃO DO DASHBOARD ---
        function calculateMealTotals(foods) {
            return foods.reduce((acc, food) => {
                acc.kcal += food.kcal; acc.carb += food.carb; acc.fat += food.fat; acc.prot += food.prot;
                return acc;
            }, { kcal: 0, carb: 0, fat: 0, prot: 0 });
        }

        function calculatePercentages(totals) {
            const totalMacros = totals.carb + totals.fat + totals.prot;
            if (totalMacros === 0) return { carb: 0, fat: 0, prot: 0 };
            return {
                carb: (totals.carb / totalMacros) * 100,
                fat: (totals.fat / totalMacros) * 100,
                prot: (totals.prot / totalMacros) * 100
            };
        }

        window.openMealDetails = (mealId) => {
            const meal = firestoreMock.meals.find(m => m.id === mealId);
            if (!meal) return;
            const totals = calculateMealTotals(meal.foods);
            
            document.getElementById("detail-title").textContent = meal.title;
            document.getElementById("detail-kcal").textContent = `${formatNumberPTBR(totals.kcal)} kcal`;
            document.getElementById("detail-carb").textContent = `${formatNumberPTBR(totals.carb)}g`;
            document.getElementById("detail-fat").textContent = `${formatNumberPTBR(totals.fat)}g`;
            document.getElementById("detail-prot").textContent = `${formatNumberPTBR(totals.prot)}g`;

            const foodsContainer = document.getElementById("foods-container");
            foodsContainer.innerHTML = "";

            if (meal.foods.length === 0) {
                foodsContainer.innerHTML = `<p style="color: var(--text-sec); text-align: center; margin-top: 2rem;">Nenhum alimento registrado nesta refeição.</p>`;
            } else {
                meal.foods.forEach(food => {
                    foodsContainer.innerHTML += `
                        <div class="food-list-item">
                            <div>
                                <div class="food-name">${food.name}</div>
                                <div class="food-macros">${food.amount} • C: ${formatNumberPTBR(food.carb)}g | G: ${formatNumberPTBR(food.fat)}g | P: ${formatNumberPTBR(food.prot)}g</div>
                            </div>
                            <div style="font-weight: 500;">${formatNumberPTBR(food.kcal)} kcal</div>
                        </div>
                    `;
                });
            }
            document.getElementById("dashboard-screen").classList.remove("active");
            document.getElementById("details-screen").classList.add("active");
        };

        function renderDashboard() {
            const container = document.getElementById("meals-container");
            container.innerHTML = "";

            firestoreMock.meals.forEach(meal => {
                const totals = calculateMealTotals(meal.foods);
                const percents = calculatePercentages(totals);
                const foodNames = meal.foods.map(f => f.name).join(", ");

                const card = document.createElement("div");
                card.className = "meal-card";
                card.onclick = () => window.openMealDetails(meal.id);
                
                card.innerHTML = `
                    <div class="meal-icon">${meal.icon}</div>
                    <div class="meal-content">
                        <div class="meal-title">${meal.title}</div>
                        <div class="meal-desc">${foodNames || "Nenhum alimento registrado"}</div>
                        <div class="meal-kcal">🔥 ${formatNumberPTBR(totals.kcal)} kcal</div>
                        <div class="macros-bar">
                            <div style="width: ${percents.carb}%; background-color: var(--carb-color);"></div>
                            <div style="width: ${percents.fat}%; background-color: var(--fat-color);"></div>
                            <div style="width: ${percents.prot}%; background-color: var(--prot-color);"></div>
                        </div>
                        <div class="macros-text">
                            <span class="dot dot-carb">${formatNumberPTBR(percents.carb)}%</span>
                            <span class="dot dot-fat">${formatNumberPTBR(percents.fat)}%</span>
                            <span class="dot dot-prot">${formatNumberPTBR(percents.prot)}%</span>
                        </div>
                    </div>
                    <button class="add-btn">+</button>
                `;

                const addBtn = card.querySelector(".add-btn");
                addBtn.onclick = (e) => {
                    e.stopPropagation(); 
                    window.openActionModal(meal);
                };
                container.appendChild(card);
            });
        }

        // --- LÓGICA DO MODAL ---
        window.openActionModal = (meal) => {
            document.getElementById("modal-title").textContent = meal.title;
            document.getElementById("action-modal").classList.add("active");
        };

        window.closeModal = (event) => {
            if (event.target.id === "action-modal") {
                document.getElementById("action-modal").classList.remove("active");
            }
        };

        window.forceCloseModal = () => {
            document.getElementById("action-modal").classList.remove("active");
        };

        window.handleEdit = () => {
            alert("Redirecionando para edição de alimentos do Firestore...");
            window.forceCloseModal();
        };

        window.handleAdd = () => {
            window.forceCloseModal();
            document.getElementById("dashboard-screen").classList.remove("active");
            document.getElementById("add-food-screen").classList.add("active");
        };

        // --- SALVANDO DADOS NO FIRESTORE ---
        document.getElementById("add-food-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            
            // Alterar o texto do botão durante o carregamento
            const submitBtn = event.target.querySelector(".save-btn");
            const originalText = submitBtn.textContent;
            submitBtn.textContent = "Salvando...";
            submitBtn.disabled = true;

            try {
                // Monta o objeto com os dados exatos digitados no formulário
                const foodData = {
                    name: document.getElementById("food-name").value,
                    portionValue: parseInputPTBR(document.getElementById("food-portion").value),
                    portionUnit: document.getElementById("food-portion-unit").value,
                    kcal: parseInputPTBR(document.getElementById("food-kcal").value),
                    
                    macros: {
                        carb: parseInputPTBR(document.getElementById("food-carb").value),
                        sugar: parseInputPTBR(document.getElementById("food-sugar").value),
                        addedSugar: parseInputPTBR(document.getElementById("food-added-sugar").value),
                        prot: parseInputPTBR(document.getElementById("food-prot").value),
                        fat: parseInputPTBR(document.getElementById("food-fat").value),
                        satFat: parseInputPTBR(document.getElementById("food-sat-fat").value),
                        transFat: parseInputPTBR(document.getElementById("food-trans-fat").value),
                        fiber: parseInputPTBR(document.getElementById("food-fiber").value),
                        sodium: parseInputPTBR(document.getElementById("food-sodium").value)
                    },
                    
                    vitamins: {
                        vitaminA: {
                            value: parseInputPTBR(document.getElementById("food-vit-a").value),
                            unit: document.getElementById("food-vit-a-unit").value,
                            refPercentage: parseInputPTBR(document.getElementById("food-vit-a-ref").value)
                        }
                        // Adicionar mapeamento das outras vitaminas e minerais conforme você for recriando os inputs
                    },
                    createdAt: new Date()
                };

                // Enviando para a Coleção "alimentos" no Firestore
                const docRef = await addDoc(collection(db, "alimentos"), foodData);
                console.log("Documento gravado com ID: ", docRef.id);
                
                alert("Alimento salvo com sucesso no banco de dados!");
                window.goBackFromAddFood();

            } catch (error) {
                console.error("Erro ao adicionar documento: ", error);
                alert("Ocorreu um erro ao salvar o alimento. Verifique o console.");
            } finally {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });

        // --- MÁSCARA PT-BR DE FORMATAÇÃO NUMÉRICA ---
        document.addEventListener("input", function(e) {
            if (e.target.classList.contains("decimal-input")) {
                let val = e.target.value;
                val = val.replace(/[^0-9,]/g, '');
                let parts = val.split(',');
                
                if (parts.length > 2) {
                    val = parts[0] + ',' + parts.slice(1).join('');
                    parts = val.split(',');
                }
                
                if (parts.length === 2 && parts[1].length > 3) {
                    parts[1] = parts[1].substring(0, 3);
                }
                
                let intPart = parts[0];
                if (intPart !== "") {
                    intPart = parseInt(intPart, 10).toString();
                    intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
                } else if (parts.length === 2) {
                    intPart = "0"; 
                }
                
                if (parts.length === 2) {
                    e.target.value = intPart + ',' + parts[1];
                } else {
                    e.target.value = intPart;
                }
            }
        });

        // INICIALIZAÇÃO
        document.addEventListener("DOMContentLoaded", () => {
            renderDashboard();
        });
    </script>
</body>
</html>
