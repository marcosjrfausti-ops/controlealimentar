<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fine Tuning - Tracker</title>
<style>
  :root {
    --bg-color: #0d0d0d; --card-bg: #1c1c1e; --icon-bg: #2c2927;
    --text-main: #f5f5f5; --text-sec: #9e9e9e; --accent: #bb86fc;
    --carb-color: #a275ff; --fat-color: #ff5252; --prot-color: #ffca28; --border-color: #333;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { background: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
  #app { width: 100%; max-width: 600px; position: relative; min-height: 100vh; overflow-x: hidden; }
  .screen { display: none; padding: 1.5rem 1.5rem 3rem; animation: fadeIn .3s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }

  /* Início */
  #home-screen { height: 100vh; padding: 0; }
  #home-screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .home-title { position: absolute; top: 3rem; font-size: 2.2rem; font-weight: 600; letter-spacing: 1px; }
  .home-btn { background: var(--accent); color: #0d0d0d; border: none; padding: 1rem 4rem; font-size: 1.2rem; font-weight: 600; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(187,134,252,.3); transition: transform .2s; }
  .home-btn:hover { transform: scale(1.05); }

  /* Geral */
  .header { display: flex; align-items: center; margin-bottom: 1.5rem; gap: 1rem; }
  .header h2 { font-size: 1.2rem; font-weight: 500; flex-grow: 1; }
  .icon-btn { background: none; border: none; color: var(--text-sec); font-size: 1.5rem; cursor: pointer; padding: .5rem; }
  .erro { background: #3b1111; color: #ff8a8a; border-radius: 10px; padding: .8rem 1rem; margin-bottom: 1rem; font-size: .85rem; }
  .vazio { color: var(--text-sec); text-align: center; margin-top: 2rem; }
  .sub { font-size: 1rem; font-weight: 500; margin-bottom: 1rem; }
  .preview { font-size: .8rem; color: var(--text-sec); margin-top: .5rem; }

  /* Refeições */
  .meal-card { display: flex; align-items: center; padding: 1.2rem 0; border-bottom: 1px solid var(--border-color); cursor: pointer; }
  .meal-card:hover { background: rgba(255,255,255,.02); }
  .meal-icon { width: 50px; height: 50px; background: var(--icon-bg); border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; margin-right: 1rem; flex-shrink: 0; }
  .meal-content { flex-grow: 1; padding-right: 1rem; }
  .meal-title { font-size: 1rem; font-weight: 500; margin-bottom: .2rem; }
  .meal-desc { font-size: .75rem; color: var(--text-sec); margin-bottom: .4rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
  .meal-kcal { font-size: .8rem; color: var(--text-sec); margin-bottom: .5rem; }
  .macros-bar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; background: #333; margin-bottom: .3rem; }
  .macros-text { font-size: .65rem; color: var(--text-sec); display: flex; gap: .5rem; }
  .dot { display: flex; align-items: center; }
  .dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }
  .dot-carb::before { background: var(--carb-color); }
  .dot-fat::before { background: var(--fat-color); }
  .dot-prot::before { background: var(--prot-color); }
  .add-btn { background: none; border: none; color: var(--text-main); font-size: 1.8rem; font-weight: 300; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
  .add-btn:hover { background: var(--icon-bg); }

  /* Detalhes */
  .macro-summary { background: var(--card-bg); border-radius: 20px; padding: 1.5rem; margin-bottom: 1.5rem; }
  .macro-summary h3 { font-size: 2.5rem; font-weight: 300; text-align: center; margin-bottom: 1rem; }
  .macro-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; text-align: center; }
  .macro-grid p { font-size: 1.2rem; font-weight: 600; }
  .macro-grid span { font-size: .75rem; color: var(--text-sec); }
  .food-list-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: var(--card-bg); border-radius: 12px; margin-bottom: .8rem; }
  .food-name { font-weight: 500; font-size: .95rem; }
  .food-macros { font-size: .75rem; color: var(--text-sec); margin-top: .3rem; }

  /* Formulários */
  .form-section { background: var(--card-bg); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; }
  .form-section-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 1.2rem; color: var(--accent); border-bottom: 1px solid var(--border-color); padding-bottom: .5rem; }
  .form-group { margin-bottom: 1.2rem; }
  .form-group label { display: block; font-size: .9rem; color: var(--text-sec); margin-bottom: .5rem; }
  .input-group { display: flex; gap: .5rem; }
  .input-control, .unit-select { background: #2c2c2e; border: 1px solid var(--border-color); color: var(--text-main); padding: .8rem; border-radius: 8px; font-size: 1rem; outline: none; }
  .input-control { flex-grow: 1; width: 100%; }
  .unit-select { font-size: .9rem; cursor: pointer; }
  .input-control:focus, .unit-select:focus { border-color: var(--accent); }
  .fixed-unit { display: flex; align-items: center; justify-content: center; background: var(--icon-bg); padding: 0 1rem; border-radius: 8px; color: var(--text-sec); font-size: .9rem; min-width: 60px; }
  .save-btn { width: 100%; padding: 1.2rem; background: var(--accent); color: #000; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; margin-top: 1rem; }
  .save-btn:hover { background: #a46cf5; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; justify-content: center; align-items: flex-end; z-index: 1000; }
  .modal-overlay.active { display: flex; }
  .modal-content { background: var(--card-bg); width: 100%; max-width: 600px; border-radius: 20px 20px 0 0; padding: 2rem 1.5rem; animation: slideUp .3s ease; }
  .modal-title { margin-bottom: 1.5rem; text-align: center; font-weight: 500; }
  .modal-btn { width: 100%; padding: 1rem; margin-bottom: 1rem; border-radius: 12px; border: none; font-size: 1rem; font-weight: 500; cursor: pointer; background: var(--icon-bg); color: var(--text-main); }
  .modal-btn.primary { background: var(--accent); color: #000; }
</style>
</head>
<body>
<div id="app">

  <section id="home-screen" class="screen active">
    <h1 class="home-title">Fine Tuning</h1>
    <button class="home-btn" data-go="dashboard">Dieta</button>
  </section>

  <section id="dashboard-screen" class="screen">
    <div class="header">
      <button class="icon-btn" data-go="home">&#10094;</button>
      <h2>Registrar refeição</h2>
    </div>
    <div id="erro" class="erro" hidden></div>
    <div id="meals-container"></div>
  </section>

  <section id="details-screen" class="screen">
    <div class="header">
      <button class="icon-btn" data-go="dashboard">&#10094;</button>
      <h2 id="detail-title">Detalhes</h2>
    </div>
    <div class="macro-summary">
      <h3 id="detail-kcal">0 kcal</h3>
      <div class="macro-grid">
        <div><span style="color:var(--carb-color)">Carboidr</span><p id="detail-carb">0g</p></div>
        <div><span style="color:var(--fat-color)">Gord.</span><p id="detail-fat">0g</p></div>
        <div><span style="color:var(--prot-color)">Proteína</span><p id="detail-prot">0g</p></div>
      </div>
    </div>
    <h3 class="sub">Alimentos Consumidos</h3>
    <div id="foods-container"></div>
  </section>

  <section id="add-item-screen" class="screen">
    <div class="header">
      <button class="icon-btn" data-go="details">&#10094;</button>
      <h2 id="item-title">Adicionar alimento</h2>
    </div>
    <form id="item-form">
      <div class="form-section">
        <div class="form-group">
          <label>Alimento</label>
          <select id="item-select" class="input-control" required></select>
        </div>
        <div class="form-group">
          <label>Quantidade</label>
          <div class="input-group">
            <input id="item-qtd" class="input-control decimal-input" placeholder="0,000" inputmode="decimal" required>
            <div id="item-unidade" class="fixed-unit">g</div>
          </div>
        </div>
        <p id="item-preview" class="preview"></p>
      </div>
      <button type="submit" class="save-btn">Adicionar à refeição</button>
    </form>
  </section>

  <section id="add-food-screen" class="screen">
    <div class="header">
      <button class="icon-btn" data-go="dashboard">&#10094;</button>
      <h2>Cadastrar Alimento</h2>
    </div>
    <form id="food-form">
      <div class="form-section">
        <div class="form-section-title">📝 Informação Nutricional</div>
        <div class="form-group">
          <label>Nome</label>
          <input class="input-control" name="nome" placeholder="Ex: Arroz Branco" required>
        </div>
        <div class="form-group">
          <label>Porção</label>
          <div class="input-group">
            <input class="input-control decimal-input" name="porcao" placeholder="0,000" inputmode="decimal" required>
            <select class="unit-select" name="porcaoUnidade"><option value="g">g</option><option value="un">un</option></select>
          </div>
        </div>
        <div class="form-group">
          <label>Valor energético</label>
          <div class="input-group">
            <input class="input-control decimal-input" name="kcal" placeholder="0,000" inputmode="decimal" required>
            <div class="fixed-unit">kcal</div>
          </div>
        </div>
      </div>
      <div class="form-section">
        <div class="form-section-title">🍞 Macronutrientes</div>
        <div id="macros-fields"></div>
      </div>
      <div class="form-section">
        <div class="form-section-title">💊 Micronutrientes (Vitaminas)</div>
        <div id="vitaminas-fields"></div>
      </div>
      <div class="form-section">
        <div class="form-section-title">🪨 Micronutrientes (Minerais)</div>
        <div id="minerais-fields"></div>
      </div>
      <button type="submit" class="save-btn">Salvar Alimento</button>
    </form>
  </section>

</div>

<div id="action-modal" class="modal-overlay">
  <div class="modal-content">
    <h3 id="modal-title" class="modal-title">Opções</h3>
    <button class="modal-btn" id="btn-add-item">Adicionar alimento à refeição</button>
    <button class="modal-btn primary" id="btn-new-food">Cadastrar novos alimentos</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  // Configuração do projeto Firebase (CONTROLE-ALIMENTAR)
  const firebaseConfig = {
    apiKey: "AIzaSyBLTPfj097saA-VrtxqWCLWDdS5acjgbEs",
    authDomain: "os-coretiva-preventiva.firebaseapp.com",
    projectId: "os-coretiva-preventiva",
    storageBucket: "os-coretiva-preventiva.firebasestorage.app",
    messagingSenderId: "1074947472672",
    appId: "1:1074947472672:web:c797327b7c398fa94b2b45e",
    measurementId: "G-H01XP1X013"
  };
  const db = getFirestore(initializeApp(firebaseConfig));

  // Estrutura fixa
  const REFEICOES = [
    { id: "cafe-da-manha", titulo: "Café da manhã", icone: "🌅" },
    { id: "almoco", titulo: "Almoço", icone: "☀️" },
    { id: "jantar", titulo: "Jantar", icone: "🌙" },
    { id: "lanches", titulo: "Lanches", icone: "🌤️" }
  ];
  const MACROS = [
    ["carb", "Carboidratos totais", "g"], ["acucTot", "Açúcares totais", "g"], ["acucAdd", "Açúcares adicionados", "g"],
    ["prot", "Proteínas", "g"], ["fat", "Gorduras totais", "g"], ["fatSat", "Gorduras saturadas", "g"],
    ["fatTrans", "Gorduras trans", "g"], ["fibra", "Fibra alimentar", "g"], ["sodio", "Sódio", "mg"]
  ];
  const VITAMINAS = ["Vitamina A", "Vitamina B2 (Riboflavina)", "Vitamina B5 (Ácido Pantotênico)", "Vitamina B9 (Ácido Fólico)", "Vitamina B12 (Cobalamina)", "Vitamina C", "Vitamina D", "Vitamina E"];
  const MINERAIS = [["Cálcio", "mg"], ["Ferro", "mg"], ["Zinco", "mg"], ["Fósforo", "mg"], ["Selênio", "mcg"], ["Potássio", "mg"]];

  const estado = { alimentos: [], itens: {} };
  let refeicaoAtual = null;

  // Utilitários
  const $ = sel => document.querySelector(sel);
  const fmt = n => new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 3 }).format(Number(n) || 0);
  const escapar = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const parseInputPTBR = s => { const v = parseFloat(String(s || "").replace(/\./g, "").replace(",", ".")); return isNaN(v) ? 0 : v; };
  const somar = itens => itens.reduce((a, i) => ({ kcal: a.kcal + i.kcal, carb: a.carb + i.carb, fat: a.fat + i.fat, prot: a.prot + i.prot }), { kcal: 0, carb: 0, fat: 0, prot: 0 });
  const calcularItem = (a, qtd) => {
    const f = qtd / a.porcao;
    return { kcal: a.kcal * f, carb: a.nutrientes.carb * f, fat: a.nutrientes.fat * f, prot: a.nutrientes.prot * f };
  };
  const percentuais = t => {
    const total = t.carb + t.fat + t.prot;
    if (!total) return { carb: 0, fat: 0, prot: 0 };
    return { carb: t.carb / total * 100, fat: t.fat / total * 100, prot: t.prot / total * 100 };
  };
  const TELAS = { home: "home-screen", dashboard: "dashboard-screen", details: "details-screen", item: "add-item-screen", food: "add-food-screen" };
  const ir = tela => {
    document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === TELAS[tela]));
    window.scrollTo(0, 0);
  };
  const alimentoSelecionado = () => estado.alimentos.find(a => a.id === $("#item-select").value);
  const fecharModal = () => $("#action-modal").classList.remove("active");

  function mostrarErro(err) {
    console.error(err);
    const box = $("#erro");
    box.textContent = `Erro do Firestore: ${err.code || err.message}. Confira se o banco foi criado e se as regras permitem leitura e escrita.`;
    box.hidden = false;
  }

  // Campos do cadastro gerados a partir das listas acima
  $("#macros-fields").innerHTML = MACROS.map(([k, nome, un]) => `
    <div class="form-group">
      <label>${nome}</label>
      <div class="input-group">
        <input class="input-control decimal-input" name="${k}" placeholder="0,000" inputmode="decimal">
        <div class="fixed-unit">${un}</div>
      </div>
    </div>`).join("");

  $("#vitaminas-fields").innerHTML = VITAMINAS.map((nome, i) => `
    <div class="form-group">
      <label>${nome}</label>
      <div class="input-group">
        <input class="input-control decimal-input" name="vit${i}" placeholder="0,000" inputmode="decimal">
        <select class="unit-select vit-unit" name="vit${i}Un"><option>mcg</option><option>g</option><option>%</option></select>
      </div>
      <div class="ref-group" hidden style="margin-top:.5rem">
        <label style="font-size:.8rem">Valor de Referência (%)</label>
        <input class="input-control decimal-input" name="vit${i}Ref" placeholder="0,000" inputmode="decimal">
      </div>
    </div>`).join("");

  $("#minerais-fields").innerHTML = MINERAIS.map(([nome, un], i) => `
    <div class="form-group">
      <label>${nome}</label>
      <div class="input-group">
        <input class="input-control decimal-input" name="min${i}" placeholder="0,000" inputmode="decimal">
        <div class="fixed-unit">${un}</div>
      </div>
    </div>`).join("");

  // Dashboard de refeições
  function renderDashboard() {
    $("#meals-container").innerHTML = REFEICOES.map(r => {
      const itens = estado.itens[r.id] || [];
      const t = somar(itens);
      const p = percentuais(t);
      const nomes = itens.map(i => escapar(i.nome)).join(", ");
      return `
        <div class="meal-card" data-meal="${r.id}">
          <div class="meal-icon">${r.icone}</div>
          <div class="meal-content">
            <div class="meal-title">${r.titulo}</div>
            <div class="meal-desc">${nomes || "Nenhum alimento registrado"}</div>
            <div class="meal-kcal">🔥 ${fmt(t.kcal)} kcal</div>
            <div class="macros-bar">
              <div style="width:${p.carb}%;background:var(--carb-color)"></div>
              <div style="width:${p.fat}%;background:var(--fat-color)"></div>
              <div style="width:${p.prot}%;background:var(--prot-color)"></div>
            </div>
            <div class="macros-text">
              <span class="dot dot-carb">${fmt(p.carb)}%</span>
              <span class="dot dot-fat">${fmt(p.fat)}%</span>
              <span class="dot dot-prot">${fmt(p.prot)}%</span>
            </div>
          </div>
          <button class="add-btn" data-add="${r.id}">+</button>
        </div>`;
    }).join("");
  }

  // Detalhes da refeição
  function abrirDetalhes(id) {
    refeicaoAtual = id;
    renderDetalhes();
    ir("details");
  }

  function renderDetalhes() {
    const r = REFEICOES.find(x => x.id === refeicaoAtual);
    const itens = estado.itens[refeicaoAtual] || [];
    const t = somar(itens);
    $("#detail-title").textContent = r.titulo;
    $("#detail-kcal").textContent = `${fmt(t.kcal)} kcal`;
    $("#detail-carb").textContent = `${fmt(t.carb)}g`;
    $("#detail-fat").textContent = `${fmt(t.fat)}g`;
    $("#detail-prot").textContent = `${fmt(t.prot)}g`;
    $("#foods-container").innerHTML = itens.length
      ? itens.map(i => `
          <div class="food-list-item">
            <div>
              <div class="food-name">${escapar(i.nome)}</div>
              <div class="food-macros">${fmt(i.quantidade)} ${i.unidade} • C: ${fmt(i.carb)}g | G: ${fmt(i.fat)}g | P: ${fmt(i.prot)}g</div>
            </div>
            <div style="font-weight:500">${fmt(i.kcal)} kcal</div>
          </div>`).join("")
      : `<p class="vazio">Nenhum alimento registrado nesta refeição.</p>`;
  }

  // Modal de ações da refeição
  function abrirModal(id) {
    refeicaoAtual = id;
    $("#modal-title").textContent = REFEICOES.find(r => r.id === id).titulo;
    $("#action-modal").classList.add("active");
  }

  // Adicionar alimento já cadastrado a uma refeição
  function abrirAdicionarItem() {
    $("#item-title").textContent = `Adicionar em ${REFEICOES.find(r => r.id === refeicaoAtual).titulo}`;
    $("#item-select").innerHTML = estado.alimentos.length
      ? estado.alimentos.map(a => `<option value="${a.id}">${escapar(a.nome)} (${fmt(a.porcao)} ${a.unidade})</option>`).join("")
      : `<option value="">Cadastre um alimento primeiro</option>`;
    $("#item-form").reset();
    atualizarResumo();
    ir("item");
  }

  function atualizarResumo() {
    const a = alimentoSelecionado();
    $("#item-unidade").textContent = a ? a.unidade : "g";
    const qtd = parseInputPTBR($("#item-qtd").value);
    if (!a || !(a.porcao > 0) || !(qtd > 0)) {
      $("#item-preview").textContent = "";
      return;
    }
    const c = calcularItem(a, qtd);
    $("#item-preview").textContent = `${fmt(c.kcal)} kcal • C: ${fmt(c.carb)}g | G: ${fmt(c.fat)}g | P: ${fmt(c.prot)}g`;
  }

  async function salvarItem(e) {
    e.preventDefault();
    const a = alimentoSelecionado();
    const qtd = parseInputPTBR($("#item-qtd").value);
    if (!a || !(a.porcao > 0) || !(qtd > 0)) return alert("Escolha um alimento e informe a quantidade.");
    const c = calcularItem(a, qtd);
    try {
      await addDoc(collection(db, "dieta_refeicoes", refeicaoAtual, "itens"), {
        nome: a.nome, alimentoId: a.id, quantidade: qtd, unidade: a.unidade,
        kcal: c.kcal, carb: c.carb, fat: c.fat, prot: c.prot, criadoEm: Date.now()
      });
      abrirDetalhes(refeicaoAtual);
    } catch (err) {
      console.error(err);
      alert(`Não foi possível salvar: ${err.code || err.message}`);
    }
  }

  // Cadastro de alimento (catálogo)
  function abrirCadastro() {
    $("#food-form").reset();
    document.querySelectorAll(".ref-group").forEach(g => (g.hidden = true));
    ir("food");
  }

  async function salvarAlimento(e) {
    e.preventDefault();
    const f = e.target;
    const num = name => parseInputPTBR(f.elements[name].value);
    const porcao = num("porcao");
    if (!(porcao > 0)) return alert("A porção precisa ser maior que zero.");
    const dados = {
      nome: f.elements.nome.value.trim(),
      porcao,
      unidade: f.elements.porcaoUnidade.value,
      kcal: num("kcal"),
      nutrientes: Object.fromEntries(MACROS.map(([k]) => [k, num(k)])),
      vitaminas: VITAMINAS.map((nome, i) => ({ nome, valor: num(`vit${i}`), unidade: f.elements[`vit${i}Un`].value, ref: num(`vit${i}Ref`) })),
      minerais: MINERAIS.map(([nome, unidade], i) => ({ nome, valor: num(`min${i}`), unidade })),
      criadoEm: Date.now()
    };
    try {
      await addDoc(collection(db, "dieta_alimentos"), dados);
      alert("Alimento salvo com sucesso!");
      ir("dashboard");
    } catch (err) {
      console.error(err);
      alert(`Não foi possível salvar: ${err.code || err.message}`);
    }
  }

  // Máscara PT-BR: milhar com ponto, até 3 casas decimais
  function mascaraDecimal(e) {
    const el = e.target;
    if (!el.classList.contains("decimal-input")) return;
    let partes = el.value.replace(/[^0-9,]/g, "").split(",");
    if (partes.length > 2) partes = [partes[0], partes.slice(1).join("")];
    if (partes.length === 2) partes[1] = partes[1].slice(0, 3);
    const inteira = partes[0] === ""
      ? (partes.length === 2 ? "0" : "")
      : parseInt(partes[0], 10).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    el.value = partes.length === 2 ? `${inteira},${partes[1]}` : inteira;
    if (el.id === "item-qtd") atualizarResumo();
  }

  // Eventos
  document.addEventListener("click", e => {
    const btn = e.target.closest("[data-go]");
    if (btn) ir(btn.dataset.go);
  });

  $("#meals-container").addEventListener("click", e => {
    const add = e.target.closest("[data-add]");
    if (add) return abrirModal(add.dataset.add);
    const card = e.target.closest("[data-meal]");
    if (card) abrirDetalhes(card.dataset.meal);
  });

  $("#action-modal").addEventListener("click", e => { if (e.target.id === "action-modal") fecharModal(); });
  $("#btn-add-item").addEventListener("click", () => { fecharModal(); abrirAdicionarItem(); });
  $("#btn-new-food").addEventListener("click", () => { fecharModal(); abrirCadastro(); });
  $("#item-select").addEventListener("change", atualizarResumo);
  $("#item-form").addEventListener("submit", salvarItem);
  $("#food-form").addEventListener("submit", salvarAlimento);
  document.addEventListener("input", mascaraDecimal);

  document.addEventListener("change", e => {
    if (!e.target.classList.contains("vit-unit")) return;
    const grupo = e.target.closest(".form-group").querySelector(".ref-group");
    grupo.hidden = e.target.value !== "%";
    if (grupo.hidden) grupo.querySelector("input").value = "";
  });

  // Firestore: leitura em tempo real
  onSnapshot(query(collection(db, "dieta_alimentos"), orderBy("nome")),
    snap => { estado.alimentos = snap.docs.map(d => ({ id: d.id, ...d.data() })); },
    mostrarErro);

  REFEICOES.forEach(r => {
    onSnapshot(query(collection(db, "dieta_refeicoes", r.id, "itens"), orderBy("criadoEm")),
      snap => {
        estado.itens[r.id] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderDashboard();
        if (refeicaoAtual === r.id) renderDetalhes();
      },
      mostrarErro);
  });

  renderDashboard();
</script>
</body>
</html>
