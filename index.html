<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fine Tuning - Tracker</title>
    
    <!-- Biblioteca Html5Qrcode para leitura de código de barras -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1c1c1e;
            --icon-bg: #2c2927;
            --text-main: #f5f5f5;
            --text-sec: #9e9e9e;
            --accent: #bb86fc;
            --carb-color: #a275ff;
            --fat-color: #ff5252;
            --prot-color: #ffca28;
            --border-color: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 600px;
            position: relative;
            background-color: var(--bg-color);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .screen {
            display: none;
            padding: 1.5rem;
            animation: fadeIn 0.3s ease;
            padding-bottom: 3rem;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* HOME SCREEN */
        #home-screen {
            height: 100vh;
            padding: 0;
        }
        
        #home-screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .home-title {
            position: absolute;
            top: 3rem;
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        .home-btn {
            background-color: var(--accent);
            color: #0d0d0d;
            border: none;
            padding: 1rem 4rem;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(187, 134, 252, 0.3);
        }

        .home-btn:hover {
            background-color: #a46cf5;
            transform: scale(1.05);
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 1rem;
        }

        .header h2 {
            font-size: 1.2rem;
            font-weight: 500;
            flex-grow: 1;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-sec);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
        }

        /* MEAL CARD */
        .meal-card {
            display: flex;
            align-items: center;
            padding: 1.2rem 0;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .meal-card:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .meal-icon {
            width: 50px;
            height: 50px;
            background-color: var(--icon-bg);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            margin-right: 1rem;
            flex-shrink: 0;
        }

        .meal-content {
            flex-grow: 1;
            padding-right: 1rem;
        }

        .meal-title {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 0.2rem;
        }

        .meal-desc {
            font-size: 0.75rem;
            color: var(--text-sec);
            margin-bottom: 0.4rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }

        .meal-kcal {
            font-size: 0.8rem;
            color: var(--text-sec);
            margin-bottom: 0.5rem;
        }

        .macros-bar {
            display: flex;
            height: 4px;
            border-radius: 2px;
            overflow: hidden;
            background-color: #333;
            margin-bottom: 0.3rem;
            width: 100%;
        }

        .macros-text {
            font-size: 0.65rem;
            color: var(--text-sec);
            display: flex;
            gap: 0.5rem;
        }

        .dot {
            display: flex;
            align-items: center;
        }

        .dot::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 4px;
        }
        .dot-carb::before { background-color: var(--carb-color); }
        .dot-fat::before { background-color: var(--fat-color); }
        .dot-prot::before { background-color: var(--prot-color); }

        .add-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.8rem;
            font-weight: 300;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-radius: 50%;
            transition: background-color 0.2s;
        }

        .add-btn:hover {
            background-color: var(--icon-bg);
        }

        /* DETAILS SCREEN */
        .macro-summary {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .macro-summary h3 {
            font-size: 2.5rem;
            font-weight: 300;
            text-align: center;
            margin-bottom: 1rem;
        }

        .macro-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            text-align: center;
        }
        
        .macro-grid-item p {
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .macro-grid-item span {
            font-size: 0.75rem;
            color: var(--text-sec);
        }

        .food-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background-color: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 0.8rem;
        }

        .food-name {
            font-weight: 500;
            font-size: 0.95rem;
        }
        
        .food-macros {
            font-size: 0.75rem;
            color: var(--text-sec);
            margin-top: 0.3rem;
        }

        /* FORM STYLES */
        .form-section {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .form-section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            color: var(--accent);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }
        
        .form-group {
            margin-bottom: 1.2rem;
        }
        
        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-sec);
            margin-bottom: 0.5rem;
        }
        
        .input-group {
            display: flex;
            gap: 0.5rem;
        }
        
        .input-control {
            flex-grow: 1;
            width: 100%;
            background-color: #2c2c2e;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .input-control:focus {
            border-color: var(--accent);
        }
        
        .fixed-unit {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--icon-bg);
            padding: 0 1rem;
            border-radius: 8px;
            color: var(--text-sec);
            font-size: 0.9rem;
            min-width: 60px;
        }
        
        .unit-select {
            background-color: #2c2c2e;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }
        
        .unit-select:focus {
            border-color: var(--accent);
        }

        .btn {
            width: 100%;
            padding: 1.2rem;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }

        .save-btn {
            background-color: var(--accent);
            color: #000;
        }

        .save-btn:hover {
            background-color: #a46cf5;
        }

        .scan-btn {
            background-color: #333;
            color: var(--text-main);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .scan-btn:hover {
            background-color: #444;
        }

        #reader {
            width: 100%;
            margin-bottom: 1.5rem;
            border-radius: 12px;
            overflow: hidden;
            display: none;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 600px;
            border-radius: 20px 20px 0 0;
            padding: 2rem 1.5rem;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-btn {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            background-color: var(--icon-bg);
            color: var(--text-main);
            transition: background-color 0.2s;
        }

        .modal-btn:hover {
            background-color: #3d3a38;
        }
        
        .modal-btn.primary {
            background-color: var(--accent);
            color: #000;
        }

        .modal-btn.primary:hover {
            background-color: #a46cf5;
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- TELA 0: INICIAL -->
        <div id="home-screen" class="screen active">
            <h1 class="home-title">Fine Tuning</h1>
            <button class="home-btn" onclick="startApp()">Dieta</button>
        </div>

        <!-- TELA 1: LISTA DE REFEIÇÕES -->
        <div id="dashboard-screen" class="screen">
            <div class="header">
                <button class="icon-btn" onclick="goHome()">&#10094;</button>
                <h2>Registrar refeição</h2>
                <button class="icon-btn">&#8942;</button>
            </div>
            <div id="meals-container">
                <!-- Renderizado via JS -->
            </div>
        </div>

        <!-- TELA 2: DETALHES DA REFEIÇÃO -->
        <div id="details-screen" class="screen">
            <div class="header">
                <button class="icon-btn" onclick="goBackToDashboard()">&#10094;</button>
                <h2 id="detail-title">Detalhes</h2>
            </div>
            
            <div class="macro-summary">
                <h3 id="detail-kcal">0 kcal</h3>
                <div class="macro-grid">
                    <div class="macro-grid-item">
                        <span style="color: var(--carb-color)">Carboidr</span>
                        <p id="detail-carb">0g</p>
                    </div>
                    <div class="macro-grid-item">
                        <span style="color: var(--fat-color)">Gord.</span>
                        <p id="detail-fat">0g</p>
                    </div>
                    <div class="macro-grid-item">
                        <span style="color: var(--prot-color)">Proteína</span>
                        <p id="detail-prot">0g</p>
                    </div>
                </div>
            </div>

            <h3 style="font-size: 1rem; margin-bottom: 1rem; font-weight: 500;">Alimentos Consumidos</h3>
            <div id="foods-container">
                <!-- Renderizado via JS -->
            </div>
        </div>

        <!-- TELA 3: CADASTRAR ALIMENTOS -->
        <div id="add-food-screen" class="screen">
            <div class="header">
                <button class="icon-btn" onclick="goBackFromAddFood()">&#10094;</button>
                <h2>Cadastrar Alimento</h2>
            </div>

            <button type="button" class="btn scan-btn" id="btn-scan" onclick="startBarcodeScanner()">
                📷 Escanear Código de Barras
            </button>
            
            <div id="reader"></div>

            <form id="add-food-form">
                
                <!-- Informação Básica -->
                <div class="form-section">
                    <div class="form-section-title">📝 Informação Nutricional</div>
                    <div class="form-group">
                        <label>Nome</label>
                        <input type="text" id="input-nome" class="input-control" placeholder="Ex: Arroz Branco" required>
                    </div>
                    <div class="form-group">
                        <label>Porção (Referência)</label>
                        <div class="input-group">
                            <input type="text" id="input-porcao" class="input-control decimal-input" placeholder="0,000" inputmode="decimal" required>
                            <select id="input-porcao-unidade" class="unit-select">
                                <option value="g">g</option>
                                <option value="ml">ml</option>
                                <option value="un">un</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Valor energético</label>
                        <div class="input-group">
                            <input type="text" id="input-kcal" class="input-control decimal-input" placeholder="0,000" inputmode="decimal" required>
                            <div class="fixed-unit">kcal</div>
                        </div>
                    </div>
                </div>

                <!-- Macronutrientes -->
                <div class="form-section">
                    <div class="form-section-title">🍞 Macronutrientes</div>
                    <div class="form-group">
                        <label>Carboidratos totais</label>
                        <div class="input-group">
                            <input type="text" id="input-carb" class="input-control decimal-input" placeholder="0,000" inputmode="decimal">
                            <div class="fixed-unit">g</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Proteínas</label>
                        <div class="input-group">
                            <input type="text" id="input-prot" class="input-control decimal-input" placeholder="0,000" inputmode="decimal">
                            <div class="fixed-unit">g</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Gorduras totais</label>
                        <div class="input-group">
                            <input type="text" id="input-fat" class="input-control decimal-input" placeholder="0,000" inputmode="decimal">
                            <div class="fixed-unit">g</div>
                        </div>
                    </div>
                    <!-- Demais campos opcionais omitidos para brevidade, mas você pode adicionar seguindo o mesmo padrão -->
                </div>

                <button type="submit" class="btn save-btn" id="btn-salvar">Salvar Alimento no Banco</button>
            </form>
        </div>
    </div>

    <!-- MODAL DE AÇÕES -->
    <div id="action-modal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="margin-bottom: 1.5rem; text-align: center; font-weight: 500;" id="modal-title">Opções</h3>
            <button class="modal-btn primary" onclick="handleAdd()">Cadastrar novos alimentos</button>
        </div>
    </div>

    <!-- SCRIPT DE NAVEGAÇÃO E MÁSCARAS (Global) -->
    <script>
        function formatNumberPTBR(num) {
            if (num === undefined || num === null || isNaN(num)) return "0";
            return new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 3 }).format(num);
        }

        // Navegação básica
        window.startApp = function() {
            document.getElementById("home-screen").classList.remove("active");
            document.getElementById("dashboard-screen").classList.add("active");
        }

        window.goHome = function() {
            document.getElementById("dashboard-screen").classList.remove("active");
            document.getElementById("home-screen").classList.add("active");
        }

        window.goBackToDashboard = function() {
            document.getElementById("details-screen").classList.remove("active");
            document.getElementById("dashboard-screen").classList.add("active");
        }

        window.openActionModal = function(mealTitle) {
            document.getElementById("modal-title").textContent = mealTitle;
            document.getElementById("action-modal").classList.add("active");
        }

        window.closeModal = function(event) {
            if (event.target.id === "action-modal") {
                document.getElementById("action-modal").classList.remove("active");
            }
        }

        window.forceCloseModal = function() {
            document.getElementById("action-modal").classList.remove("active");
        }

        window.handleAdd = function() {
            forceCloseModal();
            document.getElementById("dashboard-screen").classList.remove("active");
            document.getElementById("add-food-screen").classList.add("active");
        }

        window.goBackFromAddFood = function() {
            document.getElementById("add-food-form").reset();
            document.getElementById("add-food-screen").classList.remove("active");
            document.getElementById("dashboard-screen").classList.add("active");
            
            // Se o scanner estiver aberto, fechar
            if(html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById("reader").style.display = "none";
                    isScanning = false;
                }).catch(err => console.log(err));
            }
        }

        // Máscara Numérica (Vírgula e Ponto)
        document.addEventListener("input", function(e) {
            if (e.target.classList.contains("decimal-input")) {
                let val = e.target.value.replace(/[^0-9,]/g, '');
                let parts = val.split(',');
                if (parts.length > 2) {
                    val = parts[0] + ',' + parts.slice(1).join('');
                    parts = val.split(',');
                }
                if (parts.length === 2 && parts[1].length > 3) parts[1] = parts[1].substring(0, 3);
                let intPart = parts[0];
                if (intPart !== "") {
                    intPart = parseInt(intPart, 10).toString();
                    intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
                } else if (parts.length === 2) {
                    intPart = "0";
                }
                e.target.value = parts.length === 2 ? intPart + ',' + parts[1] : intPart;
            }
        });

        // ----------------------------------------------------
        // LÓGICA DO SCANNER DE CÓDIGO DE BARRAS E OPEN FOOD FACTS
        // ----------------------------------------------------
        let html5QrCode;
        let isScanning = false;

        window.startBarcodeScanner = function() {
            const readerDiv = document.getElementById("reader");
            
            if (isScanning) {
                // Parar scanner se já estiver rodando
                html5QrCode.stop().then(() => {
                    readerDiv.style.display = "none";
                    isScanning = false;
                });
                return;
            }

            readerDiv.style.display = "block";
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                (decodedText) => {
                    // Sucesso na leitura
                    html5QrCode.stop().then(() => {
                        readerDiv.style.display = "none";
                        isScanning = false;
                        buscarDadosNutricionais(decodedText);
                    });
                },
                (errorMessage) => {
                    // Ignorar erros contínuos de leitura
                }
            ).then(() => {
                isScanning = true;
            }).catch((err) => {
                alert("Erro ao acessar câmera: " + err);
                readerDiv.style.display = "none";
            });
        }

        function buscarDadosNutricionais(codigoBarras) {
            const btnSalvar = document.getElementById("btn-salvar");
            btnSalvar.textContent = "Buscando dados...";
            btnSalvar.disabled = true;

            // API Pública Open Food Facts
            fetch(`https://world.openfoodfacts.org/api/v0/product/${codigoBarras}.json`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 1 && data.product) {
                        const p = data.product;
                        const nutriments = p.nutriments || {};
                        
                        document.getElementById("input-nome").value = p.product_name || "Alimento Desconhecido";
                        
                        // O OpenFoodFacts geralmente retorna dados em base de 100g/100ml
                        document.getElementById("input-porcao").value = "100"; 
                        document.getElementById("input-porcao-unidade").value = p.quantity && p.quantity.includes("ml") ? "ml" : "g";

                        // Preencher macros convertendo para o formato PT-BR (, ao invés de .)
                        if(nutriments["energy-kcal_100g"]) document.getElementById("input-kcal").value = String(nutriments["energy-kcal_100g"]).replace('.', ',');
                        if(nutriments.carbohydrates_100g) document.getElementById("input-carb").value = String(nutriments.carbohydrates_100g).replace('.', ',');
                        if(nutriments.proteins_100g) document.getElementById("input-prot").value = String(nutriments.proteins_100g).replace('.', ',');
                        if(nutriments.fat_100g) document.getElementById("input-fat").value = String(nutriments.fat_100g).replace('.', ',');
                        
                        alert("Dados preenchidos com sucesso via código de barras!");
                    } else {
                        alert("Produto não encontrado na base pública. Preencha manualmente.");
                    }
                })
                .catch(err => {
                    alert("Erro ao buscar dados do produto.");
                    console.error(err);
                })
                .finally(() => {
                    btnSalvar.textContent = "Salvar Alimento no Banco";
                    btnSalvar.disabled = false;
                });
        }
    </script>

    <!-- SCRIPT DO FIREBASE (Módulo) -->
    <script type="module">
        // Importa as funções do SDK do Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Configuração reaproveitada do projeto "os-coretiva-preventiva" (agora CONTROLE-ALIMENTAR)
        const firebaseConfig = {
            apiKey: "AIzaSyBLTPfj097saA-VrtxqWCLWDdS5acjgbEs",
            authDomain: "os-coretiva-preventiva.firebaseapp.com",
            projectId: "os-coretiva-preventiva",
            storageBucket: "os-coretiva-preventiva.firebasestorage.app",
            messagingSenderId: "1074947472672",
            appId: "1:1074947472672:web:c797327b7c398fa94b2b45",
            measurementId: "G-H01XP1X013"
        };

        // Inicializa o Firebase e o Banco de Dados (Firestore)
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Referência à coleção "alimentos"
        const alimentosCol = collection(db, "alimentos");

        // Função para converter string PT-BR (1.000,50) para float (1000.50) antes de salvar no banco
        function parseInputPTBR(str) {
            if (!str) return 0;
            const cleanStr = str.replace(/\./g, '').replace(',', '.');
            const val = parseFloat(cleanStr);
            return isNaN(val) ? 0 : val;
        }

        // SALVAR DADOS NO FIREBASE
        document.getElementById("add-food-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById("btn-salvar");
            btn.textContent = "Salvando...";
            btn.disabled = true;

            try {
                // Monta o objeto de dados a partir dos inputs
                const novoAlimento = {
                    nome: document.getElementById("input-nome").value,
                    porcao: parseInputPTBR(document.getElementById("input-porcao").value),
                    unidade: document.getElementById("input-porcao-unidade").value,
                    kcal: parseInputPTBR(document.getElementById("input-kcal").value),
                    carboidratos: parseInputPTBR(document.getElementById("input-carb").value),
                    proteinas: parseInputPTBR(document.getElementById("input-prot").value),
                    gorduras: parseInputPTBR(document.getElementById("input-fat").value),
                    dataCadastro: new Date()
                };

                // Envia para o Firestore
                await addDoc(alimentosCol, novoAlimento);
                
                alert("Alimento salvo com sucesso no banco de dados!");
                window.goBackFromAddFood(); // Retorna ao painel e limpa o formulário
                carregarAlimentosSalvos(); // Atualiza a tela com o novo alimento
                
            } catch (error) {
                console.error("Erro ao salvar no Firestore: ", error);
                alert("Erro ao salvar alimento. Verifique o console.");
            } finally {
                btn.textContent = "Salvar Alimento no Banco";
                btn.disabled = false;
            }
        });

        // CARREGAR DADOS DO FIREBASE (Exibir no Dashboard como exemplo)
        async function carregarAlimentosSalvos() {
            const container = document.getElementById("meals-container");
            container.innerHTML = "<p style='text-align:center; padding: 2rem; color:var(--text-sec);'>Carregando banco de dados...</p>";

            try {
                // Busca os documentos ordenados por data
                const q = query(alimentosCol, orderBy("dataCadastro", "desc"));
                const querySnapshot = await getDocs(q);
                
                container.innerHTML = "";

                if (querySnapshot.empty) {
                    container.innerHTML = "<p style='text-align:center; padding: 2rem; color:var(--text-sec);'>Nenhum alimento cadastrado. Clique no '+' para adicionar.</p>";
                    // Mock estrutural caso vazio para poder cadastrar o primeiro
                    renderizarCardMock();
                    return;
                }

                // Agrupando todos os alimentos baixados em uma única "Refeição" (Apenas para demonstração estrutural na sua UI)
                let totalKcal = 0, totalCarb = 0, totalProt = 0, totalFat = 0;
                let alimentosHTML = "";
                let nomesAlimentos = [];

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    totalKcal += data.kcal || 0;
                    totalCarb += data.carboidratos || 0;
                    totalProt += data.proteinas || 0;
                    totalFat += data.gorduras || 0;
                    nomesAlimentos.push(data.nome);

                    alimentosHTML += `
                        <div class="food-list-item">
                            <div>
                                <div class="food-name">${data.nome}</div>
                                <div class="food-macros">${data.porcao}${data.unidade} • C: ${data.carboidratos}g | G: ${data.gorduras}g | P: ${data.proteinas}g</div>
                            </div>
                            <div style="font-weight: 500;">${data.kcal} kcal</div>
                        </div>
                    `;
                });

                // Cálculo de porcentagens para a barra
                const totalMacros = totalCarb + totalFat + totalProt;
                const percCarb = totalMacros > 0 ? (totalCarb / totalMacros) * 100 : 0;
                const percFat = totalMacros > 0 ? (totalFat / totalMacros) * 100 : 0;
                const percProt = totalMacros > 0 ? (totalProt / totalMacros) * 100 : 0;

                // Renderiza o Card de exibição conectado ao banco
                const card = document.createElement("div");
                card.className = "meal-card";
                card.onclick = () => {
                    // Preenche a tela de detalhes
                    document.getElementById("detail-title").textContent = "Alimentos do Banco";
                    document.getElementById("detail-kcal").textContent = `${formatNumberPTBR(totalKcal)} kcal`;
                    document.getElementById("detail-carb").textContent = `${formatNumberPTBR(totalCarb)}g`;
                    document.getElementById("detail-fat").textContent = `${formatNumberPTBR(totalFat)}g`;
                    document.getElementById("detail-prot").textContent = `${formatNumberPTBR(totalProt)}g`;
                    document.getElementById("foods-container").innerHTML = alimentosHTML;
                    
                    document.getElementById("dashboard-screen").classList.remove("active");
                    document.getElementById("details-screen").classList.add("active");
                };

                card.innerHTML = `
                    <div class="meal-icon">💾</div>
                    <div class="meal-content">
                        <div class="meal-title">Base de Alimentos Salvos</div>
                        <div class="meal-desc">${nomesAlimentos.join(", ")}</div>
                        <div class="meal-kcal">🔥 ${formatNumberPTBR(totalKcal)} kcal</div>
                        <div class="macros-bar">
                            <div style="width: ${percCarb}%; background-color: var(--carb-color);"></div>
                            <div style="width: ${percFat}%; background-color: var(--fat-color);"></div>
                            <div style="width: ${percProt}%; background-color: var(--prot-color);"></div>
                        </div>
                    </div>
                    <button class="add-btn" onclick="event.stopPropagation(); window.openActionModal('Base de Alimentos Salvos');">+</button>
                `;

                container.appendChild(card);

            } catch (error) {
                console.error("Erro ao ler do Firestore: ", error);
                container.innerHTML = "<p style='text-align:center; padding: 2rem; color:#ff5252;'>Erro ao conectar com o banco de dados.</p>";
            }
        }

        function renderizarCardMock() {
             const container = document.getElementById("meals-container");
             container.innerHTML += `
                <div class="meal-card">
                    <div class="meal-icon">🍽️</div>
                    <div class="meal-content">
                        <div class="meal-title">Nova Refeição</div>
                        <div class="meal-desc">Nenhum alimento na base ainda.</div>
                    </div>
                    <button class="add-btn" onclick="event.stopPropagation(); window.openActionModal('Nova Refeição');">+</button>
                </div>
            `;
        }

        // Carrega dados assim que a tela inicializar
        carregarAlimentosSalvos();

    </script>
</body>
</html>
